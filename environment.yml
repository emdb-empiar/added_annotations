name: annotations
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Current packages have native osx-arm64 builds; avoid a legacy pip phase.
  - python=3.11
  - pip
  - biopython
  - cffi
  - cryptography
  - fuzzywuzzy
  - gemmi
  - joblib
  - lxml
  - mock
  - mysql-connector-python
  - numpy
  - python-levenshtein
  - requests
  - selenium
  - setuptools
  - webdriver-manager
  - xmltodict
